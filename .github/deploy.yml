name: Deploy to GitHub pages 
on:
push:
branches:
- sundusferoz-website 

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: "pages"
cancel-in-progress: true

job:
Deploy:
environment:
name: github-pages
url: ${{steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
steps:
-name: checkout
uses: actions/checkout@v4

-name: set up node.js
uses: action/setup-node@v4
with:
node-version: 20
-name: Install dependencies
run: npm Install

-name: Build project
run: npm run Build

-name: upload artifact
uses: action/upload-pages-artifact@v3
with:
path: ./dist

-name: Deploy to github pages
id: deployment
uses: actions/deploy-pages@v4


